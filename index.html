<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The Gospels in Old Church Slavonic (Codex Marianus), word by word: parsing, paradigms, the Greek original and a concordance. Russian and English interface.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23B8321F'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='serif'%3E%E2%B0%B5%3C/text%3E%3C/svg%3E">
<title>Мариинский чтец</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monomakh&family=Noto+Sans+Glagolitic&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Geologica:wght@300;400;600&display=swap">
<style>
/* Layout (after J. H. Boyer's readers): verse numbers in a left margin, Slavonic and a chosen translation side by side; a click opens a small parse popup, and its buttons slide in the full analysis drawer. */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#1F1C19; --muted:#6E6861; --rule:#E2DFD9;
  --cinnabar:#B8321F; --greek:#2D4F86; --gold:#F6E3B4; --same:#EEF0E6; --al:#DCE6F7;
  --chip:#F1EFEB;
  --f-ocs:"Monomakh","Noto Serif","Times New Roman",serif;
  --f-glag:"Noto Sans Glagolitic","Monomakh",serif;
  --f-text:"Gentium Book Plus","Noto Serif",Georgia,serif;
  --f-ui:"Geologica","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181C; --surface:#1D2025; --ink:#E9E5DD; --muted:#A09A90; --rule:#2E3238;
  --cinnabar:#F07560; --greek:#9DBAF0; --gold:#4D3E1C; --same:#262B22; --al:#22314A; --chip:#262A30; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181C; --surface:#1D2025; --ink:#E9E5DD; --muted:#A09A90; --rule:#2E3238;
  --cinnabar:#F07560; --greek:#9DBAF0; --gold:#4D3E1C; --same:#262B22; --al:#22314A; --chip:#262A30; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
a{color:var(--greek)}
:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-ocs);font-size:24px;font-weight:400;color:var(--cinnabar);letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.books{display:flex;gap:4px}
.books button{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.books button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chnav{display:flex;align-items:center;gap:6px}
.chnav button{border:1px solid var(--rule);background:transparent;border-radius:6px;width:30px;height:30px;cursor:pointer}
.chnav select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 6px}
.tools{display:flex;gap:6px}
.viewsw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;max-width:100%}
@media (max-width:760px){.bar{gap:8px 10px}.viewsw select{max-width:9.5em}.brand b{font-size:21px}}
.viewsw select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:4px 6px}
.tools button{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
.tools button[aria-expanded="true"]{background:var(--chip)}

.settings{max-width:1280px;margin:10px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;
  border-top:1px solid var(--rule);padding-top:10px}
.settings fieldset{border:0;margin:0;padding:0;min-width:0}
.settings legend{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.settings label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer}
.settings small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- main ---------- */
main{max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;transition:padding-right .2s ease}
article{min-width:0;max-width:46rem;margin:0 auto}
body.v-both article{max-width:none}
@media (min-width:1180px){body.desk-open main,body.desk-open header.top{padding-right:max(480px,env(safe-area-inset-right,0px))}}
h1.chap{font-family:var(--f-ocs);font-weight:400;font-size:30px;margin:4px 0 2px;color:var(--ink);text-wrap:balance}
h1.chap .num{color:var(--cinnabar)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.banner{border-left:3px solid var(--cinnabar);background:var(--chip);padding:10px 14px;border-radius:0 6px 6px 0;margin:0 0 18px;font-size:14px}
.verse{display:grid;grid-template-columns:2.4rem minmax(0,1fr);column-gap:14px;padding:8px 0 12px;border-bottom:1px solid var(--rule);scroll-margin-top:120px}
.verse > *{grid-column:2}
.verse > .vg{grid-column:1;grid-row:1 / span 6;text-align:right;padding-top:9px}
body.v-both .verse{grid-template-columns:2.4rem minmax(0,1.2fr) minmax(0,1fr)}
body.v-both .verse > .side{grid-column:3;grid-row:1 / span 6}
.side{font-family:var(--f-text);font-size:16.5px;line-height:1.6;padding-top:5px;border-left:1px solid var(--rule);padding-left:14px}
.side.gr{color:var(--greek);font-size:17.5px}
body.v-tr .side{border-left:0;padding-left:0;font-size:18px}
.colhead{display:none}
body.v-both .colhead{display:grid;grid-template-columns:2.4rem minmax(0,1.2fr) minmax(0,1fr);column-gap:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--rule)}
body.v-both .colhead span:nth-child(3){padding-left:14px}
.verse:target,.verse.flash{background:linear-gradient(90deg,var(--gold),transparent 70%)}
.ocs{font-family:var(--f-ocs);font-size:23px;line-height:1.7}
.script-glag .ocs,.script-glag .pform{font-family:var(--f-glag);font-size:21px}
.vn{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--cinnabar);cursor:pointer;user-select:none;font-variant-numeric:tabular-nums}
.w{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .12s}
.w:hover{background:var(--chip)}
.w.same{background:var(--same)}
.w.sel{background:var(--gold);box-shadow:0 0 0 1px var(--cinnabar) inset}
.w.al{background:var(--al)}
.w.rare{text-decoration:underline dotted var(--muted);text-underline-offset:5px}
.pn{color:var(--cinnabar);font-size:.8em}
.lac{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-style:italic}
/* interlinear */
.il .ocs{line-height:1.25}
.il .w{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:top;margin:0 6px 10px 0}
.il .w .gl{font-family:var(--f-ui);font-size:11.5px;line-height:1.2;color:var(--muted);max-width:11em}
.il .w .pc{font-family:var(--f-ui);font-size:10.5px;line-height:1.2;color:var(--cinnabar)}
.app{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.app b{font-family:var(--f-ocs);font-weight:400;color:var(--ink);font-size:15px}
.par{font-family:var(--f-text);font-size:15.5px;line-height:1.55;margin-top:4px;display:flex;gap:8px}
.par .tag{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.06em;color:var(--muted);flex:0 0 2.6em;padding-top:4px;text-transform:uppercase}
.par .tx{min-width:0}
.par.gr .tx{color:var(--greek);font-size:17px}
.g{cursor:pointer;border-radius:3px}
.g:hover{background:var(--chip)}
.g.al{background:var(--al)}
.g.sel{background:var(--gold)}

/* ---------- desk (word panel) ---------- */
aside.desk{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);display:flex;flex-direction:column;z-index:40;
  background:var(--surface);border-left:1px solid var(--rule);min-width:0;box-shadow:-8px 0 28px rgba(0,0,0,.12);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);
  transform:translateX(105%);transition:transform .2s ease;visibility:hidden}
aside.desk.open{transform:none;visibility:visible}
.desk-head{padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.desk-head .row{display:flex;align-items:flex-start;gap:8px}
.pform{font-family:var(--f-ocs);font-size:30px;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.close{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:2px 10px;cursor:pointer}
/* popup */
.pop{position:absolute;z-index:35;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);padding:12px 14px 12px;font-size:14px}
.pop .ph{display:flex;align-items:baseline;gap:8px}
.pop .pf{font-family:var(--f-ocs);font-size:24px;line-height:1.15;flex:1;min-width:0;overflow-wrap:anywhere}
.script-glag .pop .pf{font-family:var(--f-glag);font-size:21px}
.pop .pl{color:var(--muted);font-size:13px;margin-top:2px}
.pop .pl .o{color:var(--ink)}
.pop .pg{margin:6px 0 8px;font-size:15px}
.pop .pgk{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule);font-size:13.5px}
.pop .pn2{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.pop .pn2 span{font-size:12px;border:1px solid var(--cinnabar);color:var(--cinnabar);border-radius:10px;padding:0 8px}
.pop .pa{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pop .pa button{font-size:12.5px;border:1px solid var(--rule);border-radius:6px;padding:3px 9px;background:transparent;cursor:pointer}
.pop .pa button:first-child{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pop .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
.lemline{margin-top:4px;font-size:14px}
.lemline .lem{font-family:var(--f-ocs);font-size:19px}
.gloss{margin-top:4px;font-size:15px}
.ff{color:var(--cinnabar)}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cinnabar)}
.desk-body{padding:14px 16px 18px;overflow-y:auto;min-height:0}
.desk-body h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.desk-body h3:first-child{margin-top:0}
.feat{display:flex;flex-wrap:wrap;gap:4px}
.feat span{background:var(--chip);border-radius:4px;padding:2px 7px;font-size:13px}
.feat span.k{background:transparent;border:1px solid var(--cinnabar);color:var(--cinnabar)}
.note{border-left:2px solid var(--cinnabar);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}
.note b.t{display:block;margin-bottom:2px}
[hidden]{display:none!important}
.note i{font-family:var(--f-ocs);font-style:normal;font-size:16px}
.o{font-family:var(--f-ocs);font-size:16px}
.gk{font-family:var(--f-text);color:var(--greek);font-size:16px}
.split{font-family:var(--f-ocs);font-size:20px}
.split .end{color:var(--cinnabar)}
.syn{font-size:14px}
.syn li{margin:3px 0}
.syn ul{padding-left:18px;margin:4px 0}
.lnk{cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--cinnabar)}
table.pd{border-collapse:collapse;font-size:13px;margin:4px 0 10px;width:100%}
table.pd th{font-weight:400;color:var(--muted);text-align:left;padding:3px 6px 3px 0;font-size:12px;white-space:nowrap}
table.pd td{padding:3px 6px;border-top:1px solid var(--rule);font-family:var(--f-ocs);font-size:16px;vertical-align:top}
table.pd td.cur{background:var(--gold)}
table.pd td.empty{color:var(--rule)}
table.pd sup{font-family:var(--f-ui);font-size:9.5px;color:var(--muted);margin-left:1px}
.tw{overflow-x:auto}
.conc{list-style:none;padding:0;margin:0;font-size:13.5px}
.conc li{padding:5px 0;border-top:1px solid var(--rule);cursor:pointer}
.conc li:hover{background:var(--chip)}
.conc .ref{color:var(--cinnabar);font-weight:700;font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.conc .kw{background:var(--gold);border-radius:2px}
.conc .ctx{font-family:var(--f-ocs);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.chips button{border:1px solid var(--rule);background:transparent;border-radius:12px;padding:1px 9px;cursor:pointer;font-family:var(--f-ocs);font-size:15px}
.chips button[aria-pressed="true"]{border-color:var(--cinnabar);color:var(--cinnabar)}
.chips button sup{font-family:var(--f-ui);font-size:9.5px;color:var(--muted)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:13px;margin:6px 0 10px}
.bars .b{height:7px;background:var(--cinnabar);border-radius:2px;opacity:.75}
.bars .n{color:var(--muted);font-variant-numeric:tabular-nums}
.ext{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ext a,.ext button{font-size:13px;border:1px solid var(--rule);border-radius:6px;padding:3px 9px;text-decoration:none;background:transparent;cursor:pointer;color:var(--ink)}
.muted{color:var(--muted)}
.empty-state{color:var(--muted);font-size:14px}
.empty-state p{margin:0 0 10px}
.empty-state .o{font-size:20px;color:var(--ink)}
.loading{color:var(--muted);font-size:14px;padding:40px 0}

/* about dialog */
dialog{border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);max-width:min(760px,calc(100vw - 32px));max-height:85vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:20px 24px 24px;overflow-y:auto;max-height:85vh;font-size:14.5px}
.dlg h2{font-family:var(--f-ocs);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--cinnabar)}
.dlg h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.dlg ul{padding-left:18px;margin:4px 0}
.dlg li{margin:4px 0}
.dlg .x{float:right;border:1px solid var(--rule);background:transparent;border-radius:6px;padding:2px 10px;cursor:pointer}

@media (max-width: 760px){
  body.v-both .verse{grid-template-columns:2rem minmax(0,1fr)}
  body.v-both .verse > .side{grid-column:2;grid-row:auto;border-left:0;padding-left:0;border-top:1px dashed var(--rule);margin-top:4px}
  body.v-both .colhead{display:none}
  .verse{grid-template-columns:2rem minmax(0,1fr);column-gap:8px}
  aside.desk{top:auto;left:0;width:100%;height:78vh;border-left:0;border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px);
    transform:translateY(105%);box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  .pop{position:fixed;left:8px!important;right:8px;width:auto;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .ocs{font-size:21px}
  .brand span{display:none}
}
body.script-lat{--f-ocs:"Gentium Book Plus","Noto Serif",Georgia,serif}
body.script-lat .ocs{font-size:21px}

/* ---------- front page ---------- */
:root{--have:#4A5A6E;--gap:#C9442E;--paper:#FBF6EC;--paper-rule:#E8DCC4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--have:#7E93AD;--gap:#F07560;--paper:#221F1A;--paper-rule:#3A342A}}
:root[data-theme="dark"]{--have:#7E93AD;--gap:#F07560;--paper:#221F1A;--paper-rule:#3A342A}
body.at-home header.top,body.at-home main,body.at-home #pop{display:none!important}
.home{max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--rule)}
.home-mark{font-family:var(--f-text);font-size:18px;color:var(--cinnabar)}
.home-mark small{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;padding:32px 0 44px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:32px;padding:32px 0}}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinnabar);margin:0 0 14px}
.hero h1{font-family:var(--f-text);font-weight:400;font-size:clamp(32px,5vw,50px);line-height:1.08;margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em{color:var(--cinnabar);font-style:italic}
.lede{font-family:var(--f-text);font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 26px;max-width:36em}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gospels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 0}
.gospels button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.gospels button:hover{border-color:var(--cinnabar)}
.gospels .ab{font-family:var(--f-text);font-size:20px;line-height:1.1;color:var(--cinnabar)}
.gospels .gn{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gospels small{font-size:11.5px;color:var(--muted);line-height:1.3}
@media (max-width:600px){.gospels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:20px 0 28px}.hero h1{font-size:30px;margin-bottom:12px}.lede{font-size:16.5px;margin-bottom:18px}.kicker{margin-bottom:10px}
  .btn{padding:10px 14px}}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:11px 18px;cursor:pointer;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.cta-note{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;font-size:14px;color:var(--muted);max-width:34em}
.cta-note::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:2px;background:var(--gap)}
.folio{margin:0;background:var(--paper);border:1px solid var(--paper-rule);border-radius:4px;padding:30px 30px 22px;box-shadow:0 1px 0 var(--paper-rule),0 14px 34px -22px rgba(60,40,10,.45)}
.folio .lead-ocs{font-family:"Monomakh",var(--f-text);font-size:30px;line-height:1.45;margin:0 0 18px;color:var(--ink)}
.folio .lead-ocs .ini{float:left;font-size:74px;line-height:.86;margin:6px 10px 0 0;color:var(--cinnabar)}
.folio .lead-ocs .gp{color:var(--muted)}
.folio dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;padding-top:14px;border-top:1px solid var(--paper-rule);clear:both}
.folio dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.folio dd{margin:0;font-family:var(--f-text);font-size:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.folio dd.glag{font-family:var(--f-glag);font-size:15px;line-height:1.7}
.folio figcaption{margin-top:16px;font-size:12.5px;color:var(--muted)}
.h-sec{padding:44px 0;border-top:1px solid var(--rule)}
.h-sec>h2{font-family:var(--f-text);font-weight:400;font-size:30px;margin:0 0 8px}
.h-sec>.sub{color:var(--muted);margin:0 0 26px;max-width:46em;font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr);gap:24px}}
.prose p{font-family:var(--f-text);font-size:17.5px;line-height:1.6;margin:0 0 14px}
.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border-top:1px solid var(--rule);align-self:start}
.facts dt,.facts dd{padding:9px 0;border-bottom:1px solid var(--rule);margin:0}
.facts dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:18px}
.facts dd{font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:14px 40px;margin:0 0 26px}
.stat b{display:block;font-family:var(--f-text);font-weight:400;font-size:40px;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.stat.gapst b{color:var(--gap)}
.covmap{display:grid;gap:14px}
.covrow{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:4px 14px;align-items:center}
@media (max-width:600px){.covrow{grid-template-columns:minmax(0,1fr)}}
.covrow .nm{font-size:14px}
.covrow .nm small{display:block;color:var(--muted);font-size:12px}
.track{display:flex;gap:2px;height:34px;min-width:0}
.track button{flex:var(--n) 1 0;min-width:0;border:0;padding:0;cursor:pointer;border-radius:2px;background:var(--have);position:relative}
.track button:hover,.track button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.track button.first{box-shadow:inset 0 -4px 0 var(--ink)}
.covleg{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin:16px 0 0}
.covleg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.gaplist{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 10px}
.gaplist button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.gaplist button b{color:var(--gap);font-weight:600}
.gaplist button small{color:var(--muted)}
.gapnote{font-size:14px;color:var(--muted);max-width:52em;margin:8px 0 0}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.feat article{padding:22px 22px 24px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--surface)}
.feat .no{font-size:12px;color:var(--cinnabar);letter-spacing:.08em}
.feat h3{font-family:var(--f-text);font-weight:700;font-size:19px;margin:6px 0 8px;line-height:1.25}
.feat p{margin:0;font-size:14.5px;color:var(--ink);line-height:1.5}
.feat p .hx{font-family:var(--f-text);font-style:italic;font-size:1.06em}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.steps .n{grid-row:span 2;width:34px;height:34px;border-radius:50%;border:1px solid var(--cinnabar);color:var(--cinnabar);display:grid;place-items:center;font-family:var(--f-text);font-size:18px}
.steps b{font-weight:600}
.steps span{color:var(--muted);font-size:14.5px}
.endcta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--paper-rule);border-radius:6px;padding:22px 24px;margin-top:6px}
.endcta p{margin:0;font-family:var(--f-text);font-size:19px}
.home-foot{font-size:13px;color:var(--muted);padding-top:28px;border-top:1px solid var(--rule);line-height:1.6}
.home-foot a{color:inherit}
a.brand{text-decoration:none;color:inherit}
@media (max-width:600px){.home-mark small{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const LT={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"ë","є":"e","ѥ":"je","ж":"ž","з":"z","ѕ":"dz","и":"i","і":"i","ї":"i","ꙇ":"i","й":"j","к":"k","л":"l","м":"m","н":"n","о":"o",
 "п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"ch","ц":"c","ч":"č","ш":"š","щ":"št","ъ":"ŭ","ы":"y","ꙑ":"y","ь":"ĭ","ѣ":"ě","э":"è","ю":"ju","я":"ja","ꙗ":"ja",
 "ѧ":"ę","ѩ":"ję","ѫ":"ǫ","ѭ":"jǫ","ꙙ":"ę","ѳ":"th","ѵ":"ü","ѡ":"ō","ꙉ":"ǵ","ћ":"ć","ꙿ":"ŭ"};
const SUPL={"ⷠ":"б","ⷡ":"в","ⷢ":"г","ⷣ":"д","ⷤ":"ж","ⷥ":"з","ⷦ":"к","ⷧ":"л","ⷨ":"м","ⷩ":"н","ⷪ":"о","ⷫ":"п","ⷬ":"р","ⷭ":"с","ⷮ":"т","ⷯ":"х","ⷰ":"ц","ⷱ":"ч","ⷲ":"ш","ⷳ":"щ","ⷴ":"ф","ⷵ":"ст","ⷶ":"а","ⷷ":"е","ⷸ":"ꙉ","ⷹ":"оу","ⷺ":"ѣ","ⷻ":"ю","ⷼ":"ꙗ","ⷽ":"ѧ","ⷾ":"ѫ","ⷿ":"ѩ"};
const HAS_CYR=/[Ѐ-ӿꙀ-ꚟⷠ-ⷿ]/;
function latin(s){
  if(!s||!HAS_CYR.test(s))return s;
  s=s.replace(/[ⷠ-ⷿ]/g,c=>SUPL[c]||"").replace(/[҃-҉]/g,"").replace(/оу|ѹ|ꙋ/g,"u").replace(/ОУ|Оу|Ѹ|Ꙋ/g,"U");
  let o="";for(const c of s){const lc=c.toLowerCase();const v=LT[lc];if(v==null){o+=c;continue}o+=(c!==lc&&v)?v[0].toUpperCase()+v.slice(1):v}
  return o;
}
function scr(s){
  if(!s)return s;
  if(S.script==="lat")return latin(s);
  if(S.script!=="glag")return s;
  s=s.toLowerCase().replace(/оу|ѹ|ꙋ/g,"ⱆ");
  let o="";for(const c of s)o+=GL[c]||c;return o;
}
// In English + Latin mode, transliterate any Cyrillic left in UI text (examples in notes etc.), but never the translation columns.
function latinTree(root){
  if(!(S.lang==="en"&&S.script==="lat")||!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(".side,.par")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns)if(HAS_CYR.test(n.nodeValue))n.nodeValue=latin(n.nodeValue);
}
function tokOf(id){return IX.tok[id]}
function ref(loc){return loc?`${bookAbbr(loc[0])} ${loc[1]}:${loc[2]}`:""}
function ruGloss(li){const r=LEX.cl[li];return r&&r[2]?r[2]:""}
function grEq(li){const e=LEX.eq[li];return e&&e.length?e:[]}
function enGloss(li){const e=grEq(li);if(!e.length)return "";const g=LEX.gl[e[0][0]];return g?g[3]:""}
// English gloss for an OCS lemma: meaning of the Greek word it most often translates (Dodson), with "I say" → "say".
function enLemmaGloss(li){
  let g=enGloss(li);if(!g)return "";
  return g.replace(/^I am\b/,"be").replace(/(^|, )I /g,"$1").replace(/^I /,"");
}
function glossOf(li){return S.lang==="en"?enLemmaGloss(li):ruGloss(li)}
function shortGloss(li){
  if(S.lang==="en"){const e=enLemmaGloss(li);return e?e.split(/[;,(]/)[0].trim():""}
  const r=ruGloss(li);
  if(r) return r.replace(/⚠/g,"").split(/[;(]/)[0].trim();
  const e=enGloss(li);return e?"≈ "+e.split(/[;,]/)[0]:"";
}
function morphParts(m){const out=[];if(!m)return out;for(let i=0;i<9;i++){const c=m[i];if(c&&c!=="-"&&M[i][c])out.push(M[i][c])}return out.filter(Boolean)}
function shortParse(t){
  const m=t[2]||"",pos=LEX.cl[t[1]][1];if(!m||m==="---------n")return "";
  const Tn=S.lang==="en"?{p:"pres.",i:"impf.",a:"aor.",r:"perf.",s:"l-ptc.",u:"past",l:"plpf.",f:"fut."}:{p:"наст.",i:"имперф.",a:"аор.",r:"перф.",s:"л-прич.",u:"прош.",l:"плюсквам.",f:"буд."};
  const Md=S.lang==="en"?{m:"impv.",n:"inf.",p:"ptc.",u:"supine",s:"subj."}:{m:"повел.",n:"инф.",p:"прич.",u:"супин",s:"сосл."};
  const o=[];
  if(pos==="V-"){ if(m[3]==="p"||m[3]==="n"||m[3]==="u"){o.push((Tn[m[2]]||"")+" "+(Md[m[3]]||""))}else{o.push(Tn[m[2]]||"");if(Md[m[3]])o.push(Md[m[3]])}
    if(m[0]!=="-")o.push(m[0]+T(" л.",""));}
  if(m[6]!=="-")o.push(CASE_SHORT[m[6]]||"");
  if(m[1]!=="-")o.push(NUM_SHORT[m[1]]||"");
  if(m[5]!=="-"&&pos!=="Nb")o.push(GEN_SHORT[m[5]]||"");
  return o.join(" ").replace(/\s+/g," ").trim();
}

/* ================= data loading ================= */
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
function indexBook(code){
  const d=B[code];
  for(const [ch,vs] of Object.entries(d.chapters)){
    for(const v of vs){
      const loc=[code,+ch,v.v];
      for(const id of (v.c||[])){
        const t=d.tok[id];IX.tok[id]=t;IX.loc[id]=loc;
        if(t[0]){(IX.lem[t[1]]||(IX.lem[t[1]]=[])).push(id);if(t[5])(IX.g2c[t[5]]||(IX.g2c[t[5]]=[])).push(id);}
        if(t[4])(IX.kids[t[4]]||(IX.kids[t[4]]=[])).push(id);
      }
      for(const gid of (v.gr||[])){const g=d.gtok[gid];IX.gtok[gid]=g;IX.gloc[gid]=loc;(IX.glem[g[1]]||(IX.glem[g[1]]=[])).push(gid)}
    }
  }
}
const loading={};
function loadBook(code){
  if(!loading[code]) loading[code]=getJSON(`data/${code}.json`).then(d=>{B[code]=d;indexBook(code);onBookLoaded(code);return d});
  return loading[code];
}
function loadedCount(){return Object.keys(B).length}
function loadedNote(){return loadedCount()<4?T(` (загружено ${loadedCount()} из 4 Евангелий)`,` (${loadedCount()} of 4 Gospels loaded)`):""}
function onBookLoaded(code){ if(sel&&deskOpen()) renderDesk(); }

/* ================= header controls ================= */
function buildHeader(){
  $("#books").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.b,1)};
  $("#chap").onchange=e=>go(S.book,+e.target.value);
  $("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
  $("#setBtn").onclick=()=>{const p=$("#settings");p.hidden=!p.hidden;$("#setBtn").setAttribute("aria-expanded",String(!p.hidden))};
  $("#aboutBtn").onclick=openAbout;
  $("#langSeg").onclick=e=>{const b=e.target.closest("button");if(b)setLang(b.dataset.v)};
  $("#scriptSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.script=b.dataset.v;save();refreshAll()};
  $("#glossSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.gloss=b.dataset.v;save();syncSettings();renderChapter()};
  for(const k of PAR_KEYS){$("#p-"+k).onchange=e=>{S.par[k]=e.target.checked;save();renderChapter()}}
  $("#thr").onchange=e=>{S.thr=Math.max(1,+e.target.value||1);save();renderChapter()};
  $("#parseIl").onchange=e=>{S.parseIl=e.target.checked;save();renderChapter()};
  $("#viewSeg").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;save();syncSettings();renderChapter()};
  $("#sideSel").onchange=e=>{S.side=e.target.value;save();renderChapter()};
}
function refreshAll(){
  applyDicts();applyStatic();if(atHome())renderHome();syncSettings();syncNav();renderChapter();
  if(deskOpen())renderDesk();
  if(!$("#pop").hidden)showPop();
}
function syncSettings(){
  document.body.classList.toggle("script-glag",S.script==="glag");
  document.body.classList.toggle("script-lat",S.script==="lat");
  for(const b of $("#langSeg").children)b.setAttribute("aria-pressed",String(b.dataset.v===S.lang));
  for(const b of $("#scriptSeg").children)b.setAttribute("aria-pressed",String(b.dataset.v===S.script));
  for(const b of $("#glossSeg").children)b.setAttribute("aria-pressed",String(b.dataset.v===S.gloss));
  for(const k of PAR_KEYS)$("#p-"+k).checked=!!S.par[k];
  $("#thr").value=S.thr;$("#parseIl").checked=!!S.parseIl;
  for(const b of $("#viewSeg").children)b.setAttribute("aria-pressed",String(b.dataset.v===S.view));
  document.body.classList.remove("v-ocs","v-both","v-tr");document.body.classList.add("v-"+S.view);
  $("#sideSel").value=S.side;$("#sideSel").hidden=S.view==="ocs";
  latinTree($("header.top"));
}
function syncNav(){
  $("#books").setAttribute("aria-label",T("Евангелие","Gospel"));
  $("#books").innerHTML=BOOKS.map(b=>`<button data-b="${b[0]}" title="${esc(bookName(b[0]))}" aria-pressed="${b[0]===S.book}">${bookAbbr(b[0])}</button>`).join("");
  const n=BK[S.book][3];
  $("#chap").innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}"${i+1===S.ch?" selected":""}>${T("Глава","Chapter")} ${i+1}</option>`).join("");
}
function step(d){
  let i=BOOKS.findIndex(b=>b[0]===S.book),ch=S.ch+d;
  if(ch<1){if(i===0)return;i--;ch=BOOKS[i][3]}
  else if(ch>BOOKS[i][3]){if(i===BOOKS.length-1)return;i++;ch=1}
  go(BOOKS[i][0],ch);
}
function go(book,ch,verse,tokId){
  const h=`#${book}-${ch}`+(verse?`-${verse}`:"");
  pendingSel=tokId||null;
  if(location.hash!==h) location.hash=h; else route();
}
let pendingSel=null;
async function route(){
  if(!location.hash||location.hash==="#home"){if(!atHome())capturePos();showHome(true);return}
  const fromHome=atHome();showHome(false);
  const m=/^#(MATT|MARK|LUKE|JOHN)-(\d+)(?:-(\d+))?$/.exec(location.hash||"");
  let book=S.book,ch=S.ch,verse=null;
  if(m){book=m[1];ch=Math.min(+m[2],BK[book][3])||1;verse=m[3]?+m[3]:null}
  const changed=book!==S.book||ch!==S.ch||!$("#reader .verse");
  if(changed||verse)S.v=verse||1;
  S.book=book;S.ch=ch;S.seen=true;save();syncNav();
  if(!B[book]){$("#reader").innerHTML=`<div class="loading">${T("Загрузка текста…","Loading text…")}</div>`;await loadBook(book)}
  if(changed)renderChapter();
  if(verse){const el=document.getElementById(`v-${verse}`);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600)}}
  else if(changed||fromHome) window.scrollTo(0,0);
  if(pendingSel){select("c",pendingSel,true,deskOpen());pendingSel=null}
}

/* ================= reader ================= */
function wordHTML(id,t){
  if(!t[0]) return "";
  const li=t[1],freq=LEX.cl[li][3],pos=LEX.cl[li][1];
  const rare=S.gloss==="notes"&&freq<=S.thr&&pos!=="Ne";
  const cls="w"+(rare?" rare":"");
  const before=t[7]?`<span class="pn">${esc(scr(t[7]))}</span>`:"";
  const after=t[8]==null?"":t[8];
  const afterH=after.trim()?`<span class="pn">${esc(scr(after.replace(/\s+$/,"")))}</span>${/\s$/.test(after)?" ":""}`:after;
  if(S.gloss==="il"){
    const g=freq<=S.thr||S.thr>=5000?shortGloss(li):"";
    const pc=S.parseIl?shortParse(t):"";
    return `${before}<span class="${cls}" data-id="${id}" data-l="${li}"><span class="fm">${esc(scr(t[0]))}${after.trim()?`<span class="pn">${esc(scr(after.trim()))}</span>`:""}</span>${pc?`<span class="pc">${esc(pc)}</span>`:""}<span class="gl">${esc(g)||"&nbsp;"}</span></span> `;
  }
  return `${before}<span class="${cls}" data-id="${id}" data-l="${li}">${esc(scr(t[0]))}</span>${afterH}`;
}
function renderChapter(){
  const d=B[S.book];if(!d)return;
  const vs=d.chapters[S.ch]||[];
  const anyOcs=vs.some(v=>v.c&&v.c.length);
  let h=`<h1 class="chap">${esc(bookName(S.book))} · <span class="num">${S.ch}</span></h1>
   <div class="sub">${T("Нажмите на слово: форма, лемма, значение и греческий оригинал","Click any word for its form, dictionary form, meaning and the Greek original")}</div>
   <div class="colhead"><span></span><span>${T("Мариинское евангелие","Codex Marianus (Old Church Slavonic)")}</span><span>${esc(sideName(S.side))}</span></div>`;
  if(!anyOcs) h+=`<div class="banner">${T("Мариинский кодекс эту главу не сохранил (рукопись начинается с Мф 5:24). Ниже — греческий текст и переводы; старославянский текст начнётся с Мф 5:24.","The Codex Marianus does not preserve this chapter: the manuscript begins at Matthew 5:24. The Greek and the translations are shown; the Slavonic starts at Mt 5:24.")}</div>`;
  else if(vs.some(v=>!v.c)) h+=`<div class="banner">${T("В этой главе есть стихи, которых нет в рукописи или которые пока не размечены в PROIEL; они отмечены как лакуны.","Some verses in this chapter are missing from the manuscript or not yet annotated in PROIEL; they are marked as gaps.")}</div>`;
  for(const v of vs){
    let ocs="";
    if(v.c&&v.c.length){ocs=v.c.map(id=>wordHTML(id,d.tok[id])).join("")}
    else ocs=anyOcs?`<span class="lac">${T("лакуна в рукописи","gap in the manuscript")}</span>`:"";
    let app="";
    if(S.gloss==="notes"&&v.c){
      const seen=new Set(),items=[];
      for(const id of v.c){const t=d.tok[id];if(!t[0])continue;const li=t[1];const r=LEX.cl[li];
        if(r[3]<=S.thr&&r[1]!=="Ne"&&!seen.has(li)){seen.add(li);const g=shortGloss(li);if(g)items.push(`<b>${esc(scr(clean(r[0])))}</b> ${esc(g)}`)}}
      if(items.length)app=`<div class="app">${items.join(" · ")}</div>`;
    }
    const grHTML=()=>v.gr.map(g=>{const x=d.gtok[g];return `${x[4]?esc(x[4]):""}<span class="g" data-g="${g}">${esc(x[0])}</span>${esc(x[3]==null?" ":x[3])}`}).join("");
    const trHTML=k=>k==="gr"?(v.gr&&v.gr.length?grHTML():""):(v[k]?(k==="kjv"?v[k]:esc(v[k])):"");
    let par="";
    for(const k of PAR_KEYS){
      if(!S.par[k]||(S.view!=="ocs"&&k===S.side)||S.view==="tr")continue;
      const x=trHTML(k);if(x)par+=`<div class="par${k==="gr"?" gr":""}"><span class="tag">${T(PAR_TAG[k][0],PAR_TAG[k][1])}</span><span class="tx">${x}</span></div>`;
    }
    const sideX=S.view==="ocs"?"":trHTML(S.side);
    const side=S.view==="ocs"?"":`<div class="side${S.side==="gr"?" gr":""}">${sideX||`<span class="lac">${T("нет текста","no text")}</span>`}</div>`;
    if(S.view==="tr"){ if(!sideX)continue; h+=`<div class="verse" id="v-${v.v}"><div class="vg"><span class="vn" data-v="${v.v}">${v.v}</span></div>${side}</div>`; continue }
    if(!ocs&&!par&&!sideX)continue;
    h+=`<div class="verse" id="v-${v.v}"><div class="vg"><span class="vn" data-v="${v.v}" title="${T("Ссылка на стих","Link to this verse")}">${v.v}</span></div><div class="ocs">${ocs}</div>${side}${app}${par}</div>`;
  }
  const r=$("#reader");r.innerHTML=h;r.classList.toggle("il",S.gloss==="il");
  if(sel)paintSel();
}
$("#reader").addEventListener("click",e=>{
  const w=e.target.closest(".w");if(w){select("c",w.dataset.id);return}
  const g=e.target.closest(".g");if(g){select("g",g.dataset.g);return}
  const vn=e.target.closest(".vn");if(vn){go(S.book,S.ch,+vn.dataset.v)}
});
$("#reader").addEventListener("mouseover",e=>{
  const g=e.target.closest(".g");
  document.querySelectorAll(".w.hal").forEach(x=>x.classList.remove("al","hal"));
  if(g)for(const id of (IX.g2c[g.dataset.g]||[])){const el=document.querySelector(`.w[data-id="${id}"]`);if(el&&!el.classList.contains("al"))el.classList.add("al","hal")}
});

/* ================= selection ================= */
function deskOpen(){return $("#desk").classList.contains("open")}
function openDesk(tab){if(tab)S.tab=tab;save();hidePop();renderDesk();$("#desk").classList.add("open");document.body.classList.add("desk-open")}
function closeDesk(){$("#desk").classList.remove("open");document.body.classList.remove("desk-open")}
function select(kind,id,scroll,inDesk){
  sel={kind,id};concFilter=null;
  if(kind==="g"&&S.tab!=="greek"&&S.tab!=="conc")S.tab="greek";
  if(kind==="c"&&S.tab==="greek"&&!tokOf(id)?.[5])S.tab="parse";
  paintSel();
  if(scroll){const el=document.querySelector(kind==="c"?`.w[data-id="${id}"]`:`.g[data-g="${id}"]`);if(el)el.scrollIntoView({block:"center"})}
  if(inDesk||deskOpen()){renderDesk();if(!deskOpen())openDesk()}
  else showPop();
}
function hidePop(){$("#pop").hidden=true}
function showPop(){
  const pop=$("#pop");if(!sel)return;
  const el=document.querySelector(sel.kind==="c"?`.w[data-id="${sel.id}"]`:`.g[data-g="${sel.id}"]`);
  pop.setAttribute("aria-label",T("Слово","Word"));
  pop.innerHTML=popHTML();latinTree(pop);pop.hidden=false;
  if(el){const r=el.getBoundingClientRect();const w=pop.offsetWidth;
    let left=window.scrollX+r.left;left=Math.max(window.scrollX+8,Math.min(left,window.scrollX+document.documentElement.clientWidth-w-8));
    let top=window.scrollY+r.bottom+6;
    if(r.bottom+pop.offsetHeight+12>window.innerHeight&&r.top>pop.offsetHeight+80)top=window.scrollY+r.top-pop.offsetHeight-6;
    pop.style.left=left+"px";pop.style.top=top+"px";}
}
function glossLine(li,gl){
  const r=LEX.cl[li],g=glossOf(li);
  if(r[1]==="Ne"){const gq=gl||(grEq(li).length?LEX.gl[grEq(li)[0][0]]:null);
    return `${T("имя собственное","proper name")}${gq?` · <span class="gk">${esc(clean(gq[0]))}</span>${S.lang==="en"&&gq[3]?` (${esc(gq[3])})`:""}`:""}`}
  if(!g)return `<span class="muted">${T("глосса не составлена — см. «Греческий» и «Словари»","no gloss yet; see the Greek and Dictionaries tabs")}</span>`;
  return S.lang==="en"?`${esc(g)} <span class="muted" title="Meaning of the Greek word this most often translates">(via Greek)</span>`:fmtGloss(g);
}
function popHTML(){

     <div class="pa"><button data-open="parse">${T("Разбор","Parse")}</button><button data-open="forms">${T("Формы","Forms")}</button>${g?`<button data-open="greek">${T("Греческий","Greek")}</button>`:""}<button data-open="conc">${T("Конкорданция","Concordance")}</button></div>`;

  return `<div class="ph"><span class="pf gk" style="font-family:var(--f-text)">${esc(g[0])}</span><button class="x" data-pclose aria-label="${X}">✕</button></div>

document.addEventListener("click",e=>{if(!e.target.closest("#pop,.w,.g"))hidePop()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#pop").hidden)hidePop();else if(deskOpen())closeDesk()}});
window.addEventListener("resize",()=>{if(!$("#pop").hidden)showPop()});
function paintSel(){
  document.querySelectorAll(".w.sel,.w.same,.w.al,.g.al,.g.sel").forEach(x=>x.classList.remove("sel","same","al","hal"));
  if(!sel)return;
  if(sel.kind==="c"){
    const t=tokOf(sel.id);if(!t)return;
    document.querySelectorAll(`.w[data-l="${t[1]}"]`).forEach(x=>x.classList.add("same"));
    const el=document.querySelector(`.w[data-id="${sel.id}"]`);if(el)el.classList.add("sel");
    if(t[5]){const g=document.querySelector(`.g[data-g="${t[5]}"]`);if(g)g.classList.add("al")}
  }else{
    const g=document.querySelector(`.g[data-g="${sel.id}"]`);if(g)g.classList.add("sel");
    for(const id of (IX.g2c[sel.id]||[])){const el=document.querySelector(`.w[data-id="${id}"]`);if(el)el.classList.add("al")}
  }
}

/* ================= desk ================= */
function TABS(){return [["parse",T("Разбор","Parse")],["forms",T("Формы","Forms")],["greek",T("Греческий","Greek")],["conc",T("Конкорданция","Concordance")],["dict",T("Словари","Dictionaries")]]}
function renderDesk(){
  const head=$("#deskHead"),tabs=$("#tabs"),body=$("#deskBody");
  if(!sel)return;
  let t,gid,li;
  if(sel.kind==="c"){t=tokOf(sel.id);if(!t)return;li=t[1];gid=t[5]}
  else{gid=sel.id;const c=IX.g2c[gid]||[];if(c.length){t=tokOf(c[0]);li=t[1]}}
  const X=T("Закрыть","Close");
  if(sel.kind==="c"){
    const r=LEX.cl[li];
    head.innerHTML=`<div class="row"><div class="pform">${esc(scr(t[0]))}</div><button class="close" id="closeDesk" aria-label="${X}">✕</button></div>
      <div class="lemline">${T("лемма","dictionary form")} <span class="lem lnk" data-conc="1">${esc(scr(clean(r[0])))}</span> · ${esc(POS[r[1]]||r[1])} · <span class="muted">${T(`${r[3]}× в Евангелиях`,`${r[3]}× in the Gospels`)}</span></div>
      <div class="gloss">${glossLine(li,t[5]&&IX.gtok[t[5]]?LEX.gl[IX.gtok[t[5]][1]]:null)}</div>`;
  }else{
    const g=IX.gtok[gid],gl=LEX.gl[g[1]];
    head.innerHTML=`<div class="row"><div class="pform gk" style="font-family:var(--f-text);font-size:28px">${esc(g[0])}</div><button class="close" id="closeDesk" aria-label="${X}">✕</button></div>
      <div class="lemline">${T("лемма","lemma")} <span class="gk">${esc(clean(gl[0]))}</span> · ${esc(POS[gl[1]]||gl[1])}${gl[2]?` · Strong G${gl[2]}`:""}</div>
      <div class="gloss">${esc(gl[3]||"")}</div>`;
  }
  const cb=$("#closeDesk");if(cb)cb.onclick=closeDesk;
  head.querySelectorAll("[data-conc]").forEach(x=>x.onclick=()=>{S.tab="conc";save();renderDesk()});
  const avail=TABS().filter(([k])=>sel.kind==="c"||k==="greek"||k==="conc");
  if(!avail.some(([k])=>k===S.tab))S.tab=avail[0][0];
  tabs.innerHTML=avail.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===S.tab}">${l}</button>`).join("");
  tabs.onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.t;save();renderDesk()};
  let h="";
  try{
    if(S.tab==="parse")h=tabParse(sel.id,t);
    else if(S.tab==="forms")h=tabForms(li,sel.id);
    else if(S.tab==="greek")h=tabGreek(gid,t);
    else if(S.tab==="conc")h=sel.kind==="c"?tabConc(li,sel.id):tabGreekConc(IX.gtok[gid][1],gid);
    else if(S.tab==="dict")h=tabDict(li);
  }catch(err){h=`<p class="muted">${T("Ошибка отображения","Display error")}: ${esc(err.message)}</p>`;console.error(err)}
  body.innerHTML=h;body.scrollTop=0;
  body.onclick=deskClick;
  latinTree(head);latinTree(body);
}
function fmtGloss(g){return esc(g).replace(/⚠([^;(]*)/g,'<span class="ff" title="Ложный друг переводчика">⚠$1</span>')}
function deskClick(e){
  const j=e.target.closest("[data-jump]");if(j){const [b,c,v,id]=j.dataset.jump.split("-");go(b,+c,+v,id||null);if(window.innerWidth<=760&&!id)closeDesk();return}
  const s=e.target.closest("[data-sel]");if(s){select("c",s.dataset.sel,true,true);return}
  const f=e.target.closest("[data-filter]");if(f){concFilter=concFilter===f.dataset.filter?null:f.dataset.filter;renderDesk();return}
  const gt=e.target.closest("[data-gsel]");if(gt){const id=gt.dataset.gsel;const loc=IX.gloc[id];if(loc&&(loc[0]!==S.book||loc[1]!==S.ch)){go(loc[0],loc[1],loc[2]);setTimeout(()=>select("g",id,true,true),60)}else select("g",id,true,true);return}
  const cp=e.target.closest("[data-copy]");if(cp){const txt=cp.dataset.copy;navigator.clipboard?.writeText(txt).then(()=>{cp.textContent=T("Скопировано","Copied")},()=>{cp.textContent=txt});return}
}

/* ---------- parse tab ---------- */
function tabParse(id,t){
  const r=LEX.cl[t[1]],pos=r[1],m=t[2]||"";
  let h=`<h3>${T("Форма","Form")}</h3><div class="feat">${[POS[pos]||pos,...morphParts(m)].map((x,i)=>`<span${i===0?' class="k"':""}>${esc(x)}</span>`).join("")}</div>`;
  const sp=splitEnding(t[0],clean(r[0]));
  if(sp)h+=`<div style="margin-top:8px" class="muted">${T("Сравните с леммой:","Compared with the dictionary form:")} <span class="split">${esc(scr(sp[0]))}<span class="end">${esc(scr(sp[1]))}</span></span> ← <span class="o">${esc(scr(clean(r[0])))}</span></div>`;
  const notes=grammarNotes(id,t);
  if(notes.length)h+=`<h3>${T("Что здесь происходит","What is going on here")}</h3>`+notes.map(n=>`<div class="note"><b class="t">${n[0]}</b>${n[1]}</div>`).join("");
  h+=`<h3>${T("Синтаксис","Syntax")}</h3>`+syntaxHTML(id,t);
  const cor=correspondences(clean(r[0]));
  if(cor.length)h+=`<h3>${T("Соответствия с русским","Sound correspondences with modern Russian")}</h3>`+cor.map(c=>`<div class="note">${c}</div>`).join("");
  return h;
}
function splitEnding(form,lemma){
  if(!form||!lemma)return null;
  const a=form.replace(/[҃-҉ⷠ-ⷿ]/g,""),b=lemma;
  let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  if(i<2||i>=a.length)return null;
  return [a.slice(0,i),a.slice(i)];
}
function kidsOf(id){return (IX.kids[id]||[])}
function realHead(id){
  let t=tokOf(id),h=t&&t[4],guard=0;
  while(h&&guard++<6){const ht=tokOf(h);if(!ht)break;const p=LEX.cl[ht[1]][1];if(p==="C-"||ht[6]==="C"){h=ht[4];continue}break}
  return h;
}
function tokLabel(id){
  const t=tokOf(id);if(!t)return "—";
  if(!t[0])return `<span class="muted">${EMPTY[t[6]]||"∅"}</span>`;
  return `<span class="o lnk" data-sel="${id}">${esc(scr(t[0]))}</span>`;
}
function syntaxHTML(id,t){
  const rel=t[3];let h=`<div class="syn">${T("Роль","Role")}: <b>${esc(REL[rel]||rel||"—")}</b>`;
  const head=t[4],ht=head&&tokOf(head);
  if(ht){
    const hp=LEX.cl[ht[1]][1];
    if(hp==="C-"||ht[6]==="C"){
      const rh=realHead(id);
      h+=`<br>${T("Входит в сочинение через","Coordinated by")} ${tokLabel(head)}${rh&&tokOf(rh)?`; ${T("общая вершина","shared head")}: ${tokLabel(rh)}`:""}`;
    }else if(hp==="R-"){
      const pl=clean(LEX.cl[ht[1]][0]);
      h+=`<br>${T("Управляется предлогом","Governed by the preposition")} ${tokLabel(head)}${PREP_CASE[pl]?` <span class="muted">(${esc(scr(pl))} + ${PREP_CASE[pl]})</span>`:""}`;
    }else h+=`<br>${T("Зависит от","Depends on")}: ${tokLabel(head)} <span class="muted">(${esc(REL[ht[3]]||ht[3]||"")})</span>`;
  }else h+=`<br><span class="muted">${T("Вершина предложения.","Root of the sentence.")}</span>`;
  const ks=kidsOf(id).filter(k=>tokOf(k));
  if(ks.length){
    h+=`<div style="margin-top:6px">${T("Зависимые слова:","Dependent words:")}</div><ul>`+ks.map(k=>{const kt=tokOf(k);return `<li>${tokLabel(k)} — ${esc(REL[kt[3]]||kt[3])}</li>`}).join("")+`</ul>`;
  }
  return h+"</div>";
}

/* ---------- grammar notes ---------- */
function hasKidLemma(id,lemma){return kidsOf(id).some(k=>{const t=tokOf(k);return t&&clean(LEX.cl[t[1]][0])===lemma})}
function grammarNotes(id,t){
  const N=[],m=t[2]||"----------",r=LEX.cl[t[1]],pos=r[1],lem=clean(r[0]),form=(t[0]||"").replace(/[҃-҉ⷠ-ⷿ]/g,"");
  const [p,n,tense,mood,voice,g,cs,deg,str]=m;
  const add=(a,b)=>N.push([a,b]);
  if(pos==="V-"){
    if(tense==="a"&&mood==="i"){
      const sig=/(хъ|хомъ|сте|ста|шѧ|ше|ховѣ)$/.test(form);
      add(T("Аорист","Aorist"),T(`Простое прошедшее время для однократного, завершённого действия. В русском утрачено: переводите прошедшим временем совершенного вида (<i>рече</i> «сказал», <i>приде</i> «пришёл»). Во 2 и 3 л. ед. ч. формы совпадают.${sig?" Здесь видно сигматический суффикс (-х-/-с-/-ш-), как в <i>рѣхъ, дахъ, рѣшѧ</i>.":""}`,
        `Simple past for a single, completed event, like the Greek aorist: <i>рече</i> “he said”, <i>приде</i> “he came”. Russian lost this tense and uses the perfective past instead. The 2nd and 3rd person singular look the same.${sig?" This form shows the sigmatic marker (-x-/-s-/-š-), as in <i>рѣхъ</i> “I said”, <i>дахъ</i> “I gave”.":""}`));
    }
    if(tense==="i") add(T("Имперфект","Imperfect"),T(`Прошедшее длительное или повторяющееся действие (≈ рус. несов. вид прош. вр.): <i>глаголаше</i> «говорил», <i>хождааше</i> «ходил». Признак: суффикс -ѣа-/-аа- и окончания -хъ, -ше, -хѫ.`,
      `Past action in progress or repeated: <i>глаголаше</i> “he was saying”, <i>хождааше</i> “he used to walk”. Look for the suffix -ěa-/-aa- and endings -xŭ, -še, -xǫ.`));
    if(tense==="s"&&mood==="p") add(T("Л-причастие (результатив)","L-participle (resultative)"),T(`Причастие на -лъ, -ла, -ло. Само по себе не употребляется: вместе с наст. вр. <i>бꙑти</i> образует перфект (<i>пришьлъ ѥси</i> «ты пришёл [и ты здесь]»), с имперфектом или аористом <i>бꙑти</i> — плюсквамперфект, с <i>бимь/бꙑ</i> — условное наклонение. Русское прошедшее время на -л происходит именно отсюда: связка <i>ѥсмь</i> отпала.`,
      `Participle in -lŭ, -la, -lo. It never stands alone: with the present of <i>бꙑти</i> “to be” it makes the perfect (<i>пришьлъ ѥси</i> “you have come”), with the imperfect or aorist of “to be” the pluperfect, and with <i>бимь/бꙑ</i> the conditional. The modern Russian past tense in -l comes from this form after the auxiliary dropped away.`));
    if(tense==="r") add(T("Перфект","Perfect"),T("Л-причастие + настоящее время бꙑти. Результат прошлого действия, актуальный в настоящем.","L-participle + present of “to be”: a past action whose result still holds."));
    if(tense==="l") add(T("Плюсквамперфект","Pluperfect"),T("Л-причастие + имперфект (или аорист) бꙑти: действие, предшествовавшее другому прошедшему.","L-participle + imperfect (or aorist) of “to be”: an action before another past action."));
    if(tense==="f") add(T("Будущее время","Future"),T(`У <i>бꙑти</i> есть особая форма будущего (<i>бѫдѫ, бѫдеши</i>). У других глаголов будущее выражается настоящим временем глагола совершенного вида (<i>приидетъ</i> «придёт») или описательно: <i>имамь</i>/<i>хощѫ</i>/<i>начьнѫ</i> + инфинитив.`,
      `Only <i>бꙑти</i> “to be” has a real future (<i>бѫдѫ</i> “I will be”). Other verbs express the future with the present of a perfective verb (<i>приидетъ</i> “he will come”) or with <i>имамь</i> “I have”, <i>хощѫ</i> “I want”, <i>начьнѫ</i> “I begin” + infinitive.`));
    if(tense==="p"&&mood==="i") add(T("Настоящее время","Present"),T(`Окончания: -ѫ/-ѭ, -еши/-иши, -етъ/-итъ; мн. -емъ, -ете, -ѫтъ/-ѧтъ; дв. -евѣ, -ета, -ете. У глаголов совершенного вида настоящее время обычно значит будущее, как в русском.`,
      `Endings: sg. -ǫ, -eši/-iši, -etŭ/-itŭ; pl. -emŭ, -ete, -ǫtŭ/-ętŭ; dual -evě, -eta, -ete. With perfective verbs the present usually means the future, as in modern Russian.`));
    if(mood==="m") add(T("Повелительное наклонение","Imperative"),T(`Ед. 2–3 л. -и/-и (<i>остави</i>), мн. -ѣте/-ите, дв. -ѣта/-ита; 1 л. мн. -ѣмъ/-имъ («давайте…»). Отрицание: <i>не</i> + повелит.`,
      `Command form. Sg. 2nd–3rd person -i (<i>остави</i> “leave!”), pl. -ěte/-ite, dual -ěta/-ita; 1st pl. -ěmŭ/-imŭ “let us…”. Negated with <i>не</i>.`));
    if(mood==="n") add(T("Инфинитив","Infinitive"),T("Окончание -ти (после к/г: -щи: <i>рещи, мощи</i>). Ср. рус. «мочь, печь» из *-кти, *-гти.","Ending -ti; after k/g it becomes -šti (<i>рещи</i> “to say”, <i>мощи</i> “to be able”)."));
    if(mood==="u") add(T("Супин","Supine"),T(`Неопределённая форма на -тъ после глаголов движения, выражает цель: <i>иде ловитъ рꙑбъ</i> «пошёл ловить рыбу». Дополнение при супине стоит в родительном падеже. В русском утрачен.`,
      `A verb form in -tŭ used after verbs of motion to express purpose: <i>иде ловитъ рꙑбъ</i> “he went to catch fish”. Its object goes in the genitive. Lost in modern Russian.`));
    if(mood==="s") add(T("Сослагательное (условное) наклонение","Conditional"),T("Образуется л-причастием и особыми формами бꙑти (<i>бимь, би, бꙑ, бимъ, бисте, бѫ</i>) — отсюда русская частица «бы».","Made from the l-participle plus special forms of “to be” (<i>бимь, би, бꙑ</i>…), the source of the Russian particle “бы” (would)."));
    if(mood==="p"&&tense!=="s"){
      const tn=tense==="p"?T("настоящего времени","present"):tense==="a"||tense==="u"?T("прошедшего времени","past"):M[2][tense]||"";
      add(T(`Причастие: ${voice==="p"?"страдательное":"действительное"} ${tn}`,`Participle: ${tn} ${voice==="p"?"passive":"active"}`),
        voice==="p"
          ? (tense==="p"?T(`Суффикс -мъ (<i>видимъ, любимъ</i>). Склоняется как прилагательное; ср. рус. «видимый, любимый».`,`Suffix -mŭ (<i>видимъ</i> “being seen”). Declines like an adjective.`)
                        :T(`Суффиксы -нъ/-енъ/-тъ (<i>пьсанъ, распѧтъ</i>). Склоняется как прилагательное; ср. рус. «писан, распят».`,`Suffixes -nŭ/-enŭ/-tŭ (<i>пьсанъ</i> “written”, <i>распѧтъ</i> “crucified”). Declines like an adjective.`))
          : (tense==="p"?T(`Им. п. ед. м. -ѧ/-ꙑ (<i>глаголѧ, грѧдꙑ</i>), в косвенных падежах основа на -ѧщ-/-ѫщ- (<i>глаголѭщю</i>). Ср. рус. «говорящий» (церковнослав.) и «говоря».`,`Nom. sg. masc. ends in -ę/-y (<i>глаголѧ</i> “saying”); the other cases use a stem in -ęšt-/-ǫšt- (<i>глаголѭщю</i>).`)
                        :T(`Им. п. ед. м. -ъ/-въ (<i>шьдъ, рекъ, видѣвъ</i>), в косвенных падежах основа на -ъш-/-въш- (<i>видѣвъша</i>). Ср. рус. «видевший», «видев».`,`Nom. sg. masc. ends in -ŭ/-vŭ (<i>шьдъ</i> “having gone”, <i>видѣвъ</i> “having seen”); the other cases use a stem in -ŭš-/-vŭš-.`)));
      if(str==="s"&&cs==="n") add(T("≈ русское деепричастие","≈ English “having done…” phrase"),T(`Краткая форма в именительном падеже часто работает как обстоятельство при главном глаголе (роль «${esc(REL[t[3]]||t[3])}»). Русские деепричастия — застывшие краткие причастия: <i>шедъ</i> → «шед(ши)», <i>глаголѧ</i> → «говоря».`,
        `A short-form participle in the nominative usually acts like an adverbial clause attached to the main verb (role: ${esc(REL[t[3]]||t[3])}). Translate as “having gone…”, “saying…”. Russian gerunds (деепричастия) descend from exactly these forms.`));
      if(str==="w") add(T("Полная форма причастия","Long-form participle"),T(`Полная (местоимённая) форма — определение или субстантивация: <i>грѧдꙑи</i> «грядущий, тот, кто идёт», <i>вѣроуѩи</i> «верующий».`,`The long (definite) form works as an adjective or a noun: <i>грѧдꙑи</i> “the one who comes”, <i>вѣроуѩи</i> “the one who believes”.`));
      if(cs==="d"&&(t[3]==="adv"||t[3]==="xadv"||t[3]==="obl")) {
        const subj=kidsOf(id).find(k=>tokOf(k)&&tokOf(k)[3]==="sub");
        add(T("Дательный самостоятельный","Dative absolute"),T(`Оборот «существительное/местоимение в Д. п. + причастие в Д. п.» = придаточное времени или причины. Калька греческого genitivus absolutus. ${subj?`Подлежащее оборота: ${tokLabel(subj)}. `:""}Пример: <i>вечероу же бꙑвъшоу</i> «когда наступил вечер».`,
          `A noun or pronoun in the dative plus a participle in the dative make a time or cause clause (“when…”, “since…”). It renders the Greek genitive absolute. ${subj?`Subject of the phrase: ${tokLabel(subj)}. `:""}Example: <i>вечероу же бꙑвъшоу</i> “when evening had come”.`));
      }
    }
    if(lem==="бꙑти"&&!t[0]?.startsWith("бѫ")) add(T("Глагол бꙑти","The verb бꙑти “to be”"),T("Неправильный глагол: наст. <i>ѥсмь, ѥси, ѥстъ, ѥсмъ, ѥсте, сѫтъ</i>; отриц. <i>нѣсмь… нѣстъ</i>; имперф. <i>бѣахъ, бѣаше</i> (или <i>бѣхъ, бѣ</i>); аорист <i>бꙑхъ, бꙑстъ/бꙑ, бꙑшѧ</i>; буд. <i>бѫдѫ</i>.",
      "Irregular. Present <i>ѥсмь, ѥси, ѥстъ, ѥсмъ, ѥсте, сѫтъ</i> (I am … they are); negative <i>нѣсмь … нѣстъ</i>; imperfect <i>бѣахъ, бѣаше</i> (or <i>бѣхъ, бѣ</i>); aorist <i>бꙑхъ, бꙑстъ/бꙑ, бꙑшѧ</i>; future <i>бѫдѫ</i>."));
    if(kidsOf(id).some(k=>{const kt=tokOf(k);return kt&&kt[0]&&/^с[ѧꙙ]$/.test(kt[0])})) add(T("Возвратный глагол с сѧ","Reflexive verb with сѧ"),T("Частица <i>сѧ</i> — отдельное слово (форма В. п. местоимения <i>себе</i>), может стоять не рядом с глаголом. В русском она приросла к глаголу как постфикс -ся.","<i>сѧ</i> is a separate little word (the accusative of “oneself”) and can stand away from the verb. In Russian it fused onto the verb as the ending -ся."));

function correspondences(lem){

  if(/ѧ|ѩ/.test(lem))o.push(T(`<b>ѧ</b> (малый юс, носовое [ẽ]) ≈ рус. <b>я</b>: <i>имѧ</i> → имя, <i>пѧть</i> → пять.`,`<b>ѧ</b> (little yus, nasal “ę”) became Russian <b>я</b> (ja): <i>имѧ</i> → имя “name”.`));
  if(/ѣ/.test(lem))o.push(T(`<b>ѣ</b> (ять) ≈ рус. <b>е</b>: <i>вѣра</i> → вера, <i>мѣсто</i> → место.`,`<b>ѣ</b> (yat, “ě”) became Russian <b>е</b> (e): <i>вѣра</i> → вера “faith”.`));
  if(/жд/.test(lem))o.push(T(`<b>жд</b> ≈ рус. <b>ж</b>: <i>одежда</i> ~ одёжа, <i>рождениѥ</i> ~ рожать (южнославянская черта, вошла в русский книжный язык).`,`<b>жд</b> (žd) is South Slavic; native Russian has <b>ж</b> (ž). Russian borrowed many žd-words from Church Slavonic.`));
  if(/щ|шт/.test(lem))o.push(T(`<b>щ</b> (шт) ≈ рус. <b>ч</b>: <i>нощь</i> → ночь, <i>свѣща</i> → свеча; ср. «освещение» — «свеча».`,`<b>щ</b> (št) is South Slavic; native Russian has <b>ч</b> (č): <i>нощь</i> → ночь “night”.`));
  if(/^[бвгдзкмпстхчцшж]?[бвгдзкмпстхчцшж](ра|ла|рѣ|лѣ)[бвгдзклмнпрстхчцшжщ]/.test(lem))o.push(T(`Возможно <b>неполногласие</b>: -ра-, -ла-, -рѣ-, -лѣ- между согласными ≈ рус. -оро-, -оло-, -ере-: <i>градъ</i> — город, <i>глава</i> — голова, <i>брѣгъ</i> — берег.`,`Possible <b>South Slavic -ra-/-la-</b> where Russian has -oro-/-olo-: <i>градъ</i> “city” ~ Russian город, <i>глава</i> “head” ~ голова.`));

function tabForms(li,curId){

    `Every form of <span class="o">${esc(scr(clean(r[0])))}</span> that occurs in the Codex Marianus (${occ.length} occurrences${loadedNote()}), with counts. An empty cell means the form does not occur in this text, not that it cannot exist.`)}</div>`;
  const byM={};
  for(const id of occ){const t=tokOf(id);const k=t[2];const fm=t[0].toLowerCase();(byM[k]||(byM[k]={}))[fm]=(byM[k][fm]||0)+1}
  const cell=(k)=>{const fs=byM[k];if(!fs)return `<td class="empty">—</td>`;const iscur=cur&&cur[2]===k;
    return `<td${iscur?' class="cur"':""}>${Object.entries(fs).sort((a,b)=>b[1]-a[1]).map(([f,c])=>`${esc(scr(f))}<sup>${c}</sup>`).join("<br>")}</td>`};
  const keys=Object.keys(byM);
  if(pos==="V-"){
    const fin=[["p","i",T("Настоящее","Present")],["f","i",T("Будущее","Future")],["a","i",T("Аорист","Aorist")],["i","i",T("Имперфект","Imperfect")],["p","m",T("Повелительное","Imperative")],["a","s",T("Сослагательное","Conditional")]];
    for(const [tn,md,lab] of fin){
      const ks=keys.filter(k=>k[2]===tn&&k[3]===md);if(!ks.length)continue;
      const nums=["s","d","p"].filter(nm=>ks.some(k=>k[1]===nm));
      const vc=[...new Set(ks.map(k=>k[4]))];
      for(const v of vc){
        h+=`<h3>${lab}${vc.length>1?" · "+(M[4][v]||v):""}</h3><div class="tw"><table class="pd"><tr><th></th>${nums.map(nm=>`<th>${NUM_SHORT[nm]}</th>`).join("")}</tr>`;
        for(const p of ["1","2","3"]){h+=`<tr><th>${p}${T(" л.",S.lang==="en"?(p==="1"?"st":p==="2"?"nd":"rd"):"")}</th>`+nums.map(nm=>{const k=ks.find(k=>k[0]===p&&k[1]===nm&&k[4]===v);return k?cell(k):`<td class="empty">—</td>`}).join("")+`</tr>`}
        h+=`</table></div>`;
      }
    }
    const nonfin=keys.filter(k=>k[3]==="n"||k[3]==="u");
    if(nonfin.length){h+=`<h3>${T("Инфинитив и супин","Infinitive and supine")}</h3><div class="tw"><table class="pd">`+nonfin.map(k=>`<tr><th>${M[3][k[3]]}</th>${cell(k)}</tr>`).join("")+`</table></div>`}
    const parts=keys.filter(k=>k[3]==="p");
    const groups={};for(const k of parts){const g=k[2]+k[4];(groups[g]||(groups[g]=[])).push(k)}
    for(const [g,ks] of Object.entries(groups)){
      const lab=g[0]==="s"?T("Л-причастие","L-participle"):T(`Причастие: ${M[4][g[1]]||""}, ${M[2][g[0]]||""}`,`Participle: ${M[2][g[0]]||""} ${M[4][g[1]]||""}`);
      h+=`<h3>${esc(lab)}</h3>`+nominalTables(ks,cell,true,true);
    }
  }else if(keys.some(k=>k[6]&&k[6]!=="-")){
    h+=nominalTables(keys,cell,pos!=="Nb");
    if(pos==="Nb")h+=declHint(clean(r[0]),keys);
  }else{
    h+=`<div class="tw"><table class="pd"><tr><th>${T("неизменяемое","indeclinable")}</th>${cell(keys[0])}</tr></table></div>`;
  }

}
function nominalTables(keys,cell,splitGender,compact){

    const cases=CASE_ORDER.concat(["c","e","o"]).filter(c=>(!compact&&CASE_ORDER.slice(0,6).includes(c))||ks.some(k=>k[6]===c));
    if(g!=="*")h+=`<div class="muted" style="font-size:12px;margin-top:6px">${esc(M[5][g[0]]||"")}${g[1]!=="-"?" · "+esc(M[8][g[1]]||""):""}</div>`;
    h+=`<div class="tw"><table class="pd"><tr><th></th>${nums.map(n=>`<th>${NUM_SHORT[n]}</th>`).join("")}</tr>`;
    for(const c of cases){h+=`<tr><th>${CASE_SHORT[c]||c}</th>`+nums.map(n=>{const mk=ks.filter(k=>k[1]===n&&k[6]===c);

    h+=`</table></div>`;
  }
  return h;
}

  <h2>About this reader</h2>
  <p>The text is the <b>Codex Marianus</b>, a Glagolitic Gospel book from the late 10th or early 11th century and one of the canonical Old Church Slavonic manuscripts. It begins at Matthew 5:24 and has gaps. The Cyrillic transcription, dictionary forms, the morphological and syntactic analysis of every word, and the word-by-word alignment with the Greek all come from the <b>PROIEL</b> treebank (Haug &amp; Jøhndal, Oslo).</p>
  <p>The layout follows John Boyer’s readers (johnhboyer.com: Plato, Homer, Aristotle). Text and translation sit side by side; a click on a word opens its parse, and the full analysis, forms and concordance open from there.</p>

function covStats(code){
  let tot=0,miss=0;const gaps=[];
  COV[code].forEach((r,i)=>{tot+=r[0];for(let k=1;k<r.length;k+=2){miss+=r[k+1]-r[k]+1;
    const g=gaps[gaps.length-1];
    // join a gap that runs on from the end of the previous chapter
    if(g&&r[k]===1&&g.ec===i&&g.ev===COV[code][i-1][0]){g.ec=i+1;g.ev=r[k+1];g.n+=r[k+1]}
    else gaps.push({sc:i+1,sv:r[k],ec:i+1,ev:r[k+1],n:r[k+1]-r[k]+1})}});
  return {tot,miss,have:tot-miss,gaps};
}
function gapRef(code,g){
  const a=bookAbbr(code);
  if(g.sc===g.ec&&g.sv===g.ev)return `${a} ${g.sc}:${g.sv}`;
  if(g.sc===g.ec)return `${a} ${g.sc}:${g.sv}–${g.ev}`;
  return `${a} ${g.sc}:${g.sv}–${g.ec}:${g.ev}`;
}

}

  const c=e.target.closest(".track button,.gaplist button,.gospels button");
  if(c){go(c.dataset.b,+c.dataset.c,c.dataset.v?+c.dataset.v:null);return}
});

/* ================= boot ================= */
(async function boot(){
  applyDicts();applyStatic();buildHeader();syncSettings();
  try{
    LEX=await getJSON("data/lex.json");
    await route();
    for(const b of BOOKS)loadBook(b[0]);
  }catch(e){$("#reader").innerHTML=`<div class="banner">${T("Не удалось загрузить данные","Could not load the data")}: ${esc(e.message)}. ${T("Обновите страницу.","Reload the page.")}</div>`}
  window.addEventListener("hashchange",route);
})();
</script>
</body>
